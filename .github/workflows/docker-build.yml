name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  NAMESPACE: jsj-namespace

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx@v2

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ai-travel-backend:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ai-travel-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ai-travel-backend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ai-travel-backend:buildcache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ai-travel-frontend:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ai-travel-frontend:${{ github.sha }}
          build-args: |
            VITE_AMAP_KEY=${{ secrets.VITE_AMAP_KEY }}
            VITE_API_BASE_URL=http://localhost:8080/api
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ai-travel-frontend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ai-travel-frontend:buildcache,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## Docker Images Built Successfully 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: \`${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ai-travel-backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: \`${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ai-travel-frontend:latest\`" >> $GITHUB_STEP_SUMMARY

